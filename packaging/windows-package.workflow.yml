# Place this file at .github/workflows/windows-package.yml to activate it.
name: Windows package
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Lua test dependency
        run: python -m pip install lupa
      - name: Test server and client contracts
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p '*test.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'packaging_test.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s client/tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build three ZIPs
        shell: pwsh
        run: ./packaging/build.ps1 -Version '${{ github.ref_name }}'
      - name: Inspect archives and frozen server
        shell: pwsh
        run: |
          foreach ($kind in @('client','server','complete')) {
            $zip = "dist/RiceTrials-${{ github.ref_name }}-$kind-win64.zip"
            if (-not (Test-Path $zip)) { throw "Missing $zip" }
            $dest = Join-Path $env:RUNNER_TEMP "rice-$kind"
            Expand-Archive $zip -DestinationPath $dest
            if ($kind -ne 'server' -and -not (Test-Path (Join-Path $dest 'RiceTrials/RiceTrials.lua'))) { throw 'Client missing' }
            if ($kind -ne 'client' -and -not (Test-Path (Join-Path $dest 'RiceTrialsServer/RiceTrialsServer.exe'))) { throw 'Server missing' }
            if ($kind -ne 'server' -and -not (Test-Path (Join-Path $dest 'tools/validation.py'))) { throw 'Validation kit missing' }
            if ($kind -ne 'client' -and -not (Test-Path (Join-Path $dest 'start-server.ps1'))) { throw 'Server launcher missing' }
            $bad = @(Get-ChildItem -LiteralPath $dest -Recurse -File | Where-Object { $_.Extension -match '^\.(rar|zip|7z|kn5|acd|sqlite|db)$' -or $_.Name -match '(^\.env$|credentials|token\.json$|secrets\.xml$|station_config\.lua$)' })
            if ($bad.Count -gt 0) { throw "Forbidden payload in $zip : $($bad.FullName -join ', ')" }
            Get-FileHash $zip -Algorithm SHA256
          }
          $env:RICE_ADMIN_TOKEN = 'ci-admin-secret'
          $env:RICE_STATION_TOKENS = '{"ci-station":"ci-station-secret"}'
          $server = Join-Path $env:RUNNER_TEMP 'rice-server/RiceTrialsServer/RiceTrialsServer.exe'
          $db = Join-Path $env:RUNNER_TEMP 'rice-smoke.sqlite'
          $proc = Start-Process $server -ArgumentList @('--db', $db, '--port', '18081') -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:18081/tv' -UseBasicParsing
                if ($response.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
              if ($proc.HasExited) { throw 'Frozen server exited prematurely' }
            }
            if (-not $ok) { throw 'Frozen leaderboard smoke test failed' }
          } finally { Stop-Process -Id $proc.Id -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        with:
          name: rice-trials-windows
          path: dist/RiceTrials-*-win64.zip
          if-no-files-found: error
