# Windows packaging: tests, PyInstaller server, three ZIPs, smoke test of the frozen exe, artifacts.
# Manual trigger only. It never touches game assets (no KN5/ACD in the repo) and needs no secrets.
# Private repo: run manually from the Actions tab or with gh workflow run.
name: Windows package
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (letters, digits, . _ -)'
        required: true
        default: '0.1.0'
permissions:
  contents: read
concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      RICE_VERSION: ${{ inputs.version }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version input
        shell: pwsh
        run: |
          if ($env:RICE_VERSION -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$') { throw "Invalid version: $env:RICE_VERSION" }
      - name: Install test dependency (Lua runtime for client contracts)
        run: python -m pip install --disable-pip-version-check lupa
      - name: Unit tests (server, packaging, track tool, validation kit, client)
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p '*test*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location client/tests
          python -m unittest discover -p 'test_*.py' -v
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { exit $code }
      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $bad = 0
          foreach ($file in Get-ChildItem -Recurse -Include *.ps1 -Path packaging, track) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { $bad++; $errors | ForEach-Object { Write-Error "$($file.Name):$($_.Extent.StartLineNumber) $($_.Message)" } }
            else { Write-Host "OK $($file.Name)" }
          }
          if ($bad) { exit 1 }
      - name: Build server exe (PyInstaller) and three ZIPs
        shell: pwsh
        run: ./packaging/build.ps1 -Version $env:RICE_VERSION
      - name: Inspect archives
        shell: pwsh
        run: |
          foreach ($kind in @('client','server','complete')) {
            $zip = "dist/RiceTrials-$env:RICE_VERSION-$kind-win64.zip"
            if (-not (Test-Path $zip)) { throw "Missing $zip" }
            $dest = Join-Path $env:RUNNER_TEMP "rice-$kind"
            Expand-Archive $zip -DestinationPath $dest -Force
            if ($kind -ne 'server' -and -not (Test-Path (Join-Path $dest 'RiceTrials/RiceTrials.lua'))) { throw 'Client missing' }
            if ($kind -ne 'client' -and -not (Test-Path (Join-Path $dest 'RiceTrialsServer/RiceTrialsServer.exe'))) { throw 'Server missing' }
            if ($kind -ne 'server' -and -not (Test-Path (Join-Path $dest 'tools/validation.py'))) { throw 'Validation kit missing' }
            if ($kind -ne 'client' -and -not (Test-Path (Join-Path $dest 'server-admin.ps1'))) { throw 'Server admin script missing' }
            # PyInstaller always ships the frozen stdlib as _internal/base_library.zip: allowed only at that
            # exact path and only if every entry is Python bytecode.
            $stdlib = Join-Path $dest 'RiceTrialsServer/_internal/base_library.zip'
            if (Test-Path -LiteralPath $stdlib) {
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              $za = [System.IO.Compression.ZipFile]::OpenRead($stdlib)
              try { $odd = @($za.Entries | Where-Object { $_.FullName -notmatch '\.pyc$' -and $_.FullName -notmatch '/$' } | ForEach-Object FullName) }
              finally { $za.Dispose() }
              if ($odd.Count -gt 0) { throw "base_library.zip contains non-bytecode entries: $($odd -join ', ')" }
            }
            $bad = @(Get-ChildItem -LiteralPath $dest -Recurse -File | Where-Object { $_.FullName -ne (Get-Item -LiteralPath $stdlib -ErrorAction SilentlyContinue).FullName } | Where-Object { $_.Extension -match '^\.(rar|zip|7z|kn5|acd|sqlite|db|candidate)$' -or $_.Name -match '(^\.env$|credentials|token\.json$|secrets\.xml$|station_config\.lua$)' })
            if ($bad.Count -gt 0) { throw "Forbidden payload in $zip : $($bad.FullName -join ', ')" }
            Get-FileHash $zip -Algorithm SHA256 | Format-List
          }
      - name: Smoke test frozen server (start, GET /tv, stop, --check)
        shell: pwsh
        run: |
          # Throwaway CI tokens: not secrets, valid only for this ephemeral process.
          $env:RICE_ADMIN_TOKEN = 'ci-admin-' + [guid]::NewGuid().ToString('N')
          $env:RICE_STATION_TOKENS = '{"ci-station":"ci-station-' + [guid]::NewGuid().ToString('N') + '"}'
          $server = Join-Path $env:RUNNER_TEMP 'rice-server/RiceTrialsServer/RiceTrialsServer.exe'
          $db = Join-Path $env:RUNNER_TEMP 'rice-smoke.sqlite'
          $log = Join-Path $env:RUNNER_TEMP 'rice-smoke'
          $proc = Start-Process $server -ArgumentList @('--db', "`"$db`"", '--host', '127.0.0.1', '--port', '18081') -PassThru -WindowStyle Hidden -RedirectStandardOutput "$log.out.log" -RedirectStandardError "$log.err.log"
          try {
            $ok = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              if ($proc.HasExited) { Get-Content "$log.err.log"; throw "Frozen server exited prematurely ($($proc.ExitCode))" }
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:18081/tv' -UseBasicParsing -TimeoutSec 5
                if ($response.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { Get-Content "$log.err.log"; throw 'GET /tv smoke test failed' }
            Write-Host 'GET /tv -> 200'
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            $proc.WaitForExit(10000) | Out-Null
          }
          & $server --db $db --check
          if ($LASTEXITCODE -ne 0) { throw "--check failed ($LASTEXITCODE)" }
      - name: E2E on real Windows (installer, ACL, DPAPI, server-admin, scheduled task; AC root is a fixture)
        shell: powershell
        run: |
          $zip = "dist/RiceTrials-$env:RICE_VERSION-complete-win64.zip"
          ./tests/windows/e2e-windows.ps1 -CompleteZip $zip -Evidence (Join-Path $env:RUNNER_TEMP 'e2e-evidence')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rice-trials-e2e-evidence-${{ inputs.version }}
          path: ${{ runner.temp }}/e2e-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Source-only packages (track calibration tools without derived data)
        shell: pwsh
        run: python packaging/build-linux.py --version $env:RICE_VERSION --output dist/source --track-calibration dist/none
      - uses: actions/upload-artifact@v4
        with:
          name: rice-trials-windows-${{ inputs.version }}
          path: |
            dist/RiceTrials-*-win64.zip
            dist/source/RiceRacing_Trials_*.zip
          if-no-files-found: error
          retention-days: 14
